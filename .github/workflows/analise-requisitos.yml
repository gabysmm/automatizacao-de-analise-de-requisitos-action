name: Análise de requisitos

on:
  push:
    paths:
      - "docs/requisitos/**.md"
      - "brain/**"
  workflow_dispatch:

jobs:
  analisar-requisitos:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
      - name: Analisar requisitos
        id: analise
        uses: ./
        with:
          api-key: ${{ secrets.LLM_API_KEY }}
          pasta-hus: docs/requisitos

      - name: Salvar resultado da análise
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultado-analise
          path: ${{ steps.analise.outputs.resultado }}
          if-no-files-found: warn
