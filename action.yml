#   uses: gabysmm/automatizacao-de-analise-de-requisitos-action@v2
name: "Análise de requisitos com LLM"
description: "Analisa histórias de usuário em Markdown com uma LLM, aponta falhas de qualidade (ambiguidade, lacuna, inconsistência e armadilha) e sugere correções."
author: "gabysmm"

inputs:
  api-key:
    description: "Chave de API do Gemini (gerada no Google AI Studio)."
    required: true
  pasta-hus:
    description: "Pasta com as histórias de usuário (.md), incluindo subpastas. Arquivos README.md são ignorados."
    required: false
    default: "docs/hus"
outputs:
  resultado:
    description: "Caminho do arquivo JSON com os achados da análise."
    value: ${{ steps.preparar.outputs.resultado }}

runs:
  using: "composite"
  steps:
    - name: Preparar caminhos
      id: preparar
      shell: bash
      run: |
        PASTA_TRABALHO="$RUNNER_TEMP/analise-requisitos"
        mkdir -p "$PASTA_TRABALHO"
        echo "venv=$PASTA_TRABALHO/venv" >> "$GITHUB_OUTPUT"
        echo "resultado=$PASTA_TRABALHO/resultado.json" >> "$GITHUB_OUTPUT"

    - name: Instalar Python
      id: python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        update-environment: false

    - name: Instalar dependências
      shell: bash
      env:
        PYTHON: ${{ steps.python.outputs.python-path }}
        VENV: ${{ steps.preparar.outputs.venv }}
      run: |
        "$PYTHON" -m venv "$VENV"
        "$VENV/bin/python" -m pip install --quiet --disable-pip-version-check -r "$GITHUB_ACTION_PATH/requirements.txt"

    - name: Analisar documentos
      shell: bash
      env:
        LLM_API_KEY: ${{ inputs.api-key }}
        LLM_MODELO: ""
        LLM_URL_BASE: ""
        PASTA_HUS: ${{ inputs.pasta-hus }}
        VENV: ${{ steps.preparar.outputs.venv }}
        RESULTADO: ${{ steps.preparar.outputs.resultado }}
      run: |
        "$VENV/bin/python" "$GITHUB_ACTION_PATH/scripts/agente.py" \
          --base "$GITHUB_ACTION_PATH/brain" \
          --requisitos "$PASTA_HUS" \
          --saida "$RESULTADO"

    - name: Gerar relatório
      shell: bash
      env:
        VENV: ${{ steps.preparar.outputs.venv }}
        RESULTADO: ${{ steps.preparar.outputs.resultado }}
      run: |
        "$VENV/bin/python" "$GITHUB_ACTION_PATH/scripts/gerar_relatorio.py" "$RESULTADO"
        
    - name: Verificar achados
      shell: bash
      env:
        VENV: ${{ steps.preparar.outputs.venv }}
        RESULTADO: ${{ steps.preparar.outputs.resultado }}
      run: |
        "$VENV/bin/python" "$GITHUB_ACTION_PATH/scripts/verificar_achados.py" "$RESULTADO"
